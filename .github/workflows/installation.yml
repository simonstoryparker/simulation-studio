name: Installer and updater acceptance
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to test
        default: v0.1.0
        required: true
        type: string
      build_run_id:
        description: Successful release build run for this draft
        default: "38789162004"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      STUDIO_UPDATER_PUBLIC_KEY: ${{ vars.STUDIO_UPDATER_PUBLIC_KEY }}
      TAG: ${{ inputs.tag }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Download original release build artifacts (read only)
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          gh run download "$BUILD_RUN_ID" --pattern 'release-*' --dir downloaded
          mkdir release
          cp downloaded/release-*/* release/
          node scripts/assemble-release.mjs release "${TAG#v}"
      - run: node tests/installation/prepare.mjs smoke-app
      - run: npm ci
        working-directory: smoke-app
      - run: node scripts/generate-notices.mjs
        working-directory: smoke-app
      - run: npm run tauri -- build
        working-directory: smoke-app
      - run: node tests/installation/run.mjs release src-tauri/target/release/bundle installation-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            installation-results/*.json
            installation-results/*.log
